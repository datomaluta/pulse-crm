<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Pulse CRM</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Pulse CRM: an Angular admin dashboard demo with customers, deals pipeline and analytics."
    />
    <meta name="theme-color" content="#0b0e17" />

    <!-- Link previews (Open Graph / Twitter) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Pulse CRM" />
    <meta property="og:title" content="Pulse CRM: Angular admin dashboard" />
    <meta
      property="og:description"
      content="Customers, drag-and-drop deals pipeline, revenue analytics and role-based access. Built with Angular 21, signals and RxJS."
    />
    <meta property="og:url" content="https://pulse-crm-rouge-xi.vercel.app/" />
    <meta property="og:image" content="https://pulse-crm-rouge-xi.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Pulse CRM dashboard with revenue chart and KPI cards" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://pulse-crm-rouge-xi.vercel.app/og-image.png" />

    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply the saved theme before Angular boots to avoid a light/dark flash.
      try {
        var t = JSON.parse(localStorage.getItem('pulse-crm.theme'));
        if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
